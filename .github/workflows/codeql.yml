# CodeQL, the second layer over the compiler warnings in build.yml.
#
# It reads what the compiler cannot: paths through the program rather than one
# translation unit at a time, which is where use-after-free, leaked allocations
# and null dereferences live. Unlike a warning gate, it does not have to start
# from a clean tree -- a pull request is judged on the alerts it introduces,
# while what is already there waits in the Security tab. That is what makes it
# usable on a fork carrying a machine-assisted GTK+3 port.
#
# Both toolkits are built, because the #else side of the 263
# GTK_CHECK_VERSION splits is compiled nowhere else and is the specification
# the gtk-3 side was ported from.
name: codeql

on:
  # Every branch, not only main. `schedule` and `workflow_dispatch` are read
  # from the default branch and nowhere else, and this file has never been on
  # it, so with `branches: [main]` here the analysis had never run once: no
  # cron, no Run workflow button in the UI, and no push to match. `push` and
  # `pull_request` are the two triggers that fire from the branch they arrive
  # on, which is why build.yml has been running all along and this has not.
  push:
  pull_request:
    branches: [main]
  schedule:
    # Friday evening, so a run that finds something lands before the weekend
    # rather than during it, and the tree is re-read with whatever queries
    # CodeQL has gained since. Actions crons are UTC: 16:47 UTC is 19:47 in
    # Europe/Moscow. Deliberately not on the hour, which is when everyone
    # else's jobs start.
    - cron: "47 16 * * 5"
  workflow_dispatch:

permissions:
  contents: read

# Two toolkits at up to an hour each, now that every branch is analyzed: drop
# a run the moment a newer commit makes it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze c-cpp, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        gtk: [3, 2]

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
              build-essential cmake pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          # The default suite is tuned for security holes in server code. The
          # quality queries are the ones that matter for an editor: null
          # dereferences, leaks, uninitialized reads, dead code.
          queries: security-and-quality
          # Two queries dropped, and this is the only mechanism that drops
          # anything: `// codeql[rule-id]` comments are recognised by the
          # engine but code scanning never reads the SARIF suppression they
          # produce -- measured, and recorded in AGENTS.md -- and paths-ignore
          # does not apply to a language that is built, which is why the
          # vendored directories are still analyzed here while the analyze
          # target skips them.
          #
          # Both of these are statistical queries, and this tree breaks their
          # statistics by construction rather than by accident:
          #
          # cpp/unterminated-variadic-call infers the terminator from the
          #   other call sites. glib and GTK count their variadic arguments
          #   instead of terminating them -- g_signal_new(), and
          #   gtk_binding_entry_add_signal(), take an n_args and then that
          #   many entries -- and since most signals have none, the query sees
          #   "34 of 36 calls end in 0" and reads the count as a terminator.
          #   All three findings were the two calls that do pass arguments.
          #
          # cpp/inconsistent-null-check flags a call whose result is usually
          #   checked. g_slist_prepend() cannot return null and
          #   g_list_delete_link() returns it whenever the list empties, so
          #   the ratio it measures says nothing. Two of its ten findings were
          #   in gtksourceview, which is not ours to change.
          #
          # Not excluded: cpp/use-after-free and cpp/double-free. Their nine
          # findings here are all one blind spot -- a struct field reassigned
          # after g_free() keeps the freed state -- but the query is worth
          # having armed for a tenth that is real, so those are dismissed one
          # by one in the Security tab instead.
          config: |
            query-filters:
              - exclude:
                  id: cpp/unterminated-variadic-call
              - exclude:
                  id: cpp/inconsistent-null-check

      # build-mode: manual, because autobuild would have to guess GTK_VERSION
      # and would leave ENABLE_LSP and ENABLE_TERMINAL at AUTO, quietly
      # analyzing a medit with no terminal pane and no language server client.
      # vte dropped GTK+2 in 2011, so the terminal exists for the gtk-3 build
      # only.
      - name: Build
        run: |
          set -eux
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}
          cmake --build build -j"$(nproc)"

      # A category per toolkit, or the second run would replace the first one's
      # alerts instead of sitting beside them: CodeQL keys a result set by
      # category, and these two analyze different code -- the #else side of the
      # 263 GTK_CHECK_VERSION splits is compiled in the gtk-2 run and nowhere
      # else.
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp/gtk:${{ matrix.gtk }}"
