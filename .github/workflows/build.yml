# Compile medit everywhere it is expected to compile, with warnings fatal.
#
# The local machine says very little about the distributions this fork targets:
# it has gcc 12 and glib 2.74, while the matrix below spans gcc 11 to gcc 15 and
# cmake 3.22 to cmake 4.2. Every class of breakage recorded in AGENTS.md --
# symbols newer than the oldest glib, constructs one compiler accepts silently
# and another rejects -- is invisible until one of these jobs runs.
#
# Fedora is not here: package.yml builds the rpm on fedora:44, and %cmake
# compiles it with LTO and gcc 15, which is what this job was for. It is not
# quite the same thing -- the spec does not ask for ENABLE_STRICT, so an -Wodr
# report there is a line in the log rather than a failure -- but a second full
# build of the tree is a lot to pay for that difference.
#
# Which distributions: the two ends of the range, not every point in it. What
# breaks a build is the age of the toolchain and of GTK+3, and the images below
# are the oldest and the newest still supported -- 3.24.33 with gcc 11, glib
# 2.72 and cmake 3.22 against 3.24.52 with gcc 15, glib 2.88 and cmake 4.2.
# Nothing has ever broken in the middle of that range without breaking at one
# of its ends, and the middle is not unbuilt anyway: debian:13 is compiled by
# the clang job, the UI tests and the deb packaging, and debian:12 is what this
# is developed on.
name: build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both toolkits on every deb-based target. GTK+2 is still a supported build,
  # and mooplugin-builtin.cpp includes the plugin headers unconditionally, so a
  # green GTK+3 build proves nothing about it.
  deb:
    name: ${{ matrix.image }}, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04   # gtk 3.24.33, glib 2.72, gcc 11, cmake 3.22
          - ubuntu:26.04   # gtk 3.24.52, glib 2.88, gcc 15, cmake 4.2
        gtk: [2, 3]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout: actions/checkout wants git, and the container has none.
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              build-essential cmake git pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      - uses: actions/checkout@v7

      - name: Configure
        run: |
          set -eux
          # ENABLE_LSP and ENABLE_TERMINAL default to AUTO, which turns a
          # missing dependency into a build quietly lacking that feature. Ask
          # for them by name so the job fails instead. vte-2.91 dropped GTK+2 in
          # 2011, so the terminal pane exists for the GTK+3 build only.
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_STRICT=ON \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

  # The language definitions and the style schemes, against the two RELAX NG
  # schemas that ship beside them. src/mooedit/langs/check.sh has existed for a
  # while and was run by hand; 187 files take under a second, so there is no
  # reason for it not to run on every push.
  #
  # A job of its own rather than a step in the matrix: it needs no compiler, no
  # gtk and no build, and running it ten times would say the same thing ten
  # times.
  langs:
    name: language definitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install xmllint
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libxml2-utils

      - name: Validate
        run: src/mooedit/langs/check.sh

  # clang is not a target -- every distribution builds these packages with gcc,
  # and nothing in the tree selects a compiler. It is here as a second opinion,
  # and it earns its place: -Wsometimes-uninitialized caught a variable read on
  # a path where nothing had written it, inside a block still marked "written by
  # AI", which gcc says nothing about at any warning level. Its -Wunused-function
  # is stricter too, and between them they cost one G_GNUC_UNUSED sweep to get
  # green.
  #
  # A current distribution rather than an old one: the point is the diagnostics,
  # not the target coverage, which is what the deb matrix above is for.
  clang:
    name: clang, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        gtk: [2, 3]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              clang clang-tidy clang-tools cmake make git pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      - uses: actions/checkout@v7

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_STRICT=ON \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The static analyzer, through the same target a developer runs locally
      # (cmake/Analyze.cmake). clang-tidy and run-clang-tidy are installed with
      # the rest above rather than here, because Analyze.cmake looks for them
      # with find_program() -- that is, when the tree is configured, not when
      # the target runs.
      # Both toolkits. It is a gate: the analyzer reports nothing on this tree,
      # every finding it used to have being either fixed or marked at its line
      # with a NOLINTNEXTLINE and the reason. gtk-2 is here for the #else
      # branches of the 263 GTK_CHECK_VERSION splits, which the gtk-3 run never
      # compiles and which nothing else would analyze.
      - name: Static analysis
        run: cmake --build build --target analyze
