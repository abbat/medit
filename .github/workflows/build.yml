# Compile medit everywhere it is expected to compile, with warnings fatal.
#
# The local machine says very little about the distributions this fork targets:
# it has gcc 12 and glib 2.74, while the matrix below spans gcc 11 to gcc 15
# and cmake 3.22 to cmake 4.2, and the Fedora package is built with LTO. Every
# class of breakage recorded in AGENTS.md -- symbols newer than the oldest glib,
# structs that only -Wodr sees, constructs one compiler accepts silently and
# another rejects -- is invisible until one of these jobs runs.
#
# Which distributions: the ones still supported. Debian 11 (its LTS ended in
# August 2026) and Ubuntu 20.04 (standard support ended in May 2025) are gone,
# and dropping bullseye removes the snapshot.debian.org workaround that its
# dead archive needed.
name: build

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Both toolkits on every deb-based target. GTK+2 is still a supported build,
  # and mooplugin-builtin.cpp includes the plugin headers unconditionally, so a
  # green GTK+3 build proves nothing about it.
  deb:
    name: ${{ matrix.image }}, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:26.04
          - ubuntu:24.04
          - ubuntu:22.04
          - debian:13
          - debian:12
        gtk: [2, 3]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout: actions/checkout wants git, and the container has none.
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              build-essential cmake git pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -eux
          # ENABLE_LSP and ENABLE_TERMINAL default to AUTO, which turns a
          # missing dependency into a build quietly lacking that feature. Ask
          # for them by name so the job fails instead. vte-2.91 dropped GTK+2 in
          # 2011, so the terminal pane exists for the GTK+3 build only.
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_STRICT=ON \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

  # clang is not a target -- every distribution builds these packages with gcc,
  # and nothing in the tree selects a compiler. It is here as a second opinion,
  # and it earns its place: -Wsometimes-uninitialized caught a variable read on
  # a path where nothing had written it, inside a block still marked "written by
  # AI", which gcc says nothing about at any warning level. Its -Wunused-function
  # is stricter too, and between them they cost one G_GNUC_UNUSED sweep to get
  # green.
  #
  # A current distribution rather than an old one: the point is the diagnostics,
  # not the target coverage, which is what the deb matrix above is for.
  clang:
    name: clang, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        gtk: [2, 3]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
              clang clang-tidy clang-tools cmake make git pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_STRICT=ON \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The static analyzer, through the same target a developer runs locally
      # (cmake/Analyze.cmake). clang-tidy and run-clang-tidy are installed with
      # the rest above rather than here, because Analyze.cmake looks for them
      # with find_program() -- that is, when the tree is configured, not when
      # the target runs. Reporting only: the findings it starts from are not a
      # gate yet, and CodeQL is the one that judges a pull request on what it
      # introduces.
      # Both toolkits, though today the gtk-2 run finds nothing the gtk-3 run
      # does not: its 29 findings are a strict subset of the other's 32, the
      # three it lacks being dead stores in GTK+3-only code. It is here for the
      # #else branches of the 263 GTK_CHECK_VERSION splits, which the gtk-3 run
      # never compiles and which nothing else would analyze.
      - name: Static analysis
        run: cmake --build build --target analyze

  # Fedora is gtk-3 only, and is here for its compiler rather than its
  # packages: gcc 14 with LTO is what caught the two file-local structs sharing
  # a name across translation units (-Wodr) and the identifiers that become
  # keywords in C++20. Neither is visible without link time optimization, so
  # this job turns it on the way the rpm build does.
  fedora:
    name: fedora:44, gtk3, LTO
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: |
          set -eux
          # fedora-cisco-openh264 is frequently unreachable and a weak
          # dependency drags it in, which fails the whole transaction.
          dnf -y --setopt=install_weak_deps=False --disablerepo=fedora-cisco-openh264 install \
              cmake make gcc gcc-c++ git \
              gtk3-devel glib2-devel libxml2-devel gdk-pixbuf2-devel \
              json-glib-devel vte291-devel \
              libICE-devel libSM-devel \
              intltool gettext

      - uses: actions/checkout@v4

      - name: Configure
        run: |
          set -eux
          cmake -S . -B build \
              -DGTK_VERSION=3 \
              -DENABLE_STRICT=ON \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=ON \
              -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"
