# Build with clang, analyze the source, then drive the program.
#
# The last of those is what nothing else in CI does: a real X server, a real
# accessibility bus, real clicks, and a sanitizer underneath watching what the
# clicks touch. It is the only job that can fail because a dialog stopped
# opening.
#
# The first two used to be a job of their own in build.yml. They are here
# because this job already compiles the whole tree twice, once per toolkit, and
# compiling it twice more to say the same thing about clang's diagnostics and
# clang-tidy's findings is a build nobody reads. The cost is wall clock: what
# ran beside the tests now runs before them.
#
# clang is not a target -- every distribution builds these packages with gcc --
# it is a second opinion, and it earns its place: -Wsometimes-uninitialized
# caught a variable read on a path where nothing had written it, inside a block
# still marked "written by AI", which gcc says nothing about at any warning
# level.
#
# Both toolkits, one distribution. The distribution matters much less here than
# in build.yml -- what is being tested is medit's behaviour, not whether it
# compiles against a particular glib -- while the toolkit matters a great deal,
# because the GTK+2 and GTK+3 paths through the same dialog are different code,
# and because the gtk-2 build is what analyzes the #else branches of the 263
# GTK_CHECK_VERSION splits.
name: ui

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: debian:13, clang, gtk${{ matrix.gtk }}
    runs-on: ubuntu-latest
    container: debian:13
    strategy:
      fail-fast: false
      matrix:
        gtk: [2, 3]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # Before checkout: actions/checkout wants git, and the container has none.
      - name: Install build dependencies
        run: |
          set -eux
          apt-get update -qq
          # libclang-rt-dev is not optional and not obvious: without it clang
          # accepts -fsanitize= and fails to link, which cmake reports as a
          # compiler that does not accept the flag at all.
          apt-get install -y -qq --no-install-recommends \
              clang clang-tidy clang-tools libclang-rt-dev cmake make git \
              pkg-config intltool gettext \
              libglib2.0-dev libxml2-dev libxml2-utils libgtk2.0-dev libgtk-3-dev \
              libjson-glib-dev libvte-2.91-dev \
              libice-dev libsm-dev libxext-dev libxrender-dev

      # What the harness itself needs, over and above a build.
      #
      #   xvfb, xdotool          the display and the pointer
      #   dbus-daemon            dbus-run-session, one session bus per test
      #   at-spi2-core           the accessibility bus and its registry
      #   python3-pyatspi        how the test reads the widget tree
      #   libatk-adaptor         the bridge from GTK+2's atk to that bus
      #   libgail-common         GTK+2 has no accessibility without it; GTK+3
      #                          has it built in
      #   desktop-file-utils     update-desktop-database, for the fake browser
      #   fonts-dejavu-core      a container has no fonts at all, and a test
      #                          that clicks a link clicks where the text is
      #   imagemagick            the screenshot taken when a test fails
      - name: Install what the UI tests need
        run: |
          set -eux
          apt-get install -y -qq --no-install-recommends \
              xvfb xdotool dbus-daemon at-spi2-core python3-pyatspi \
              libatk-adaptor libgail-common desktop-file-utils \
              fonts-dejavu-core imagemagick

          # dbus refuses to start without one, and a container image ships an
          # empty /etc/machine-id.
          dbus-uuidgen --ensure

      - uses: actions/checkout@v7

      # ENABLE_STRICT, which it used not to be: the argument against it was
      # that a warning from the sanitizer instrumentation would fail a job about
      # behaviour, and the instrumentation turns out to produce none -- measured
      # in this container, both toolkits, before the clang job was folded in.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          set -eux
          cmake -S . -B build \
              -DGTK_VERSION=${{ matrix.gtk }} \
              -DENABLE_STRICT=ON \
              -DENABLE_UI_TESTS=ON \
              -DENABLE_SANITIZERS=address,undefined \
              -DENABLE_LSP=ON \
              -DENABLE_TERMINAL=${{ matrix.gtk == 3 && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The static analyzer, through the same target a developer runs locally
      # (cmake/Analyze.cmake); clang-tidy and run-clang-tidy come with the
      # packages above rather than here, because Analyze.cmake looks for them
      # when the tree is configured, not when the target runs.
      #
      # Before the tests, not after: it reads the source, so it needs nothing
      # the tests produce, and it is the cheaper of the two to fail. It is a
      # gate -- the analyzer reports nothing on this tree, every finding it used
      # to have being either fixed or marked at its line with a NOLINTNEXTLINE
      # and the reason.
      - name: Static analysis
        run: cmake --build build --target analyze

      # Through the ui-test target rather than ctest directly, so that the path
      # a developer uses is the path CI proves works.
      - name: Run
        run: cmake --build build --target ui-test

      # medit's own output, the X server's, the sanitizer logs, sanitizer.json
      # and a screenshot of the moment it went wrong. A UI failure is close to
      # undiagnosable without them, and they are a few hundred kilobytes.
      - name: Collect the evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-logs-gtk${{ matrix.gtk }}
          path: build/ui-tests/
          if-no-files-found: warn
